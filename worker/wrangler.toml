name = "finance-dashboard-worker"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "finance_dashboard"
database_id = "967a1066-41c5-4679-bb9d-514c9c5b19ca"

[[kv_namespaces]]
binding = "KV"
id = "80030991dd4d4ce5a910c3cb71cce95e"

[ai]
binding = "AI"

[triggers]
# UTC 00:00 = 台北 08:00（台股開盤前 1 小時，已涵蓋前一晚美股 + 盤後新聞）
crons = ["0 0 * * *"]
